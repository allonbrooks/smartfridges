# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fridge
      POSTGRES_USER: root
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:80"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_NAME: fridge
      DB_USER: root
      DB_PASSWORD: devpassword
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: dev-secret-key
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      - db

volumes:
  pgdata: